name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check public test fixtures
        run: python tests/check-fixtures.py
      - name: Check native UI translations and Ribbon labels
        run: python tests/check-localization.py
      - name: Build native add-in
        shell: pwsh
        run: ./scripts/build.ps1 -Architecture x64
      - name: Test layout, appearance, window state, persistence, close choices and localization
        shell: pwsh
        run: ./scripts/test-native.ps1
      - name: Build and verify installers
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Verify installer languages and text layout
        shell: pwsh
        run: ./tests/installer-localization-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: openOfficetab-win-x64
          path: delivery/*
